version: 2
updates:
  # Gradle dependencies (versions live in gradle/libs.versions.toml)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      androidx-and-compose:
        patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
      testing:
        patterns:
          - "org.robolectric*"
          - "junit*"
          - "com.squareup.okhttp3*"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
